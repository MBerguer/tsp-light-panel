[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/eventstore",
    "crates/server",
    "crates/simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["TSP Light Panel contributors"]
repository = "https://github.com/mberguer/tsp-light-panel"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }
futures-util = "0.3"
parking_lot = "0.12"
dashmap = "6.1"

ts-rs = { version = "10.1", features = ["chrono-impl", "uuid-impl", "serde-compat"] }
proptest = "1.5"
tokio-test = "0.4"
tempfile = "3.13"
serde_yml = "0.0.12"

tsp_core = { path = "crates/core", package = "tsp-core" }
tsp_eventstore = { path = "crates/eventstore", package = "tsp-eventstore" }
tsp_server = { path = "crates/server", package = "tsp-server" }
