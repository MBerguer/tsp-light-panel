; PlatformIO Project Configuration for ESP32-S3 HUB75 Digital Flag Panel
; Circuit: Victor Borrat Fabini (El Pinar) Light Panel System

[env:esp32-s3-matrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Panel Dimensions (Default: 64x64 using 2x P5 64x32 panels chained)
    -DPANEL_RES_X=64
    -DPANEL_RES_Y=64
    -DPANEL_CHAIN=1

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.12
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
